{% set name = "spopt" %}
{% set version = "0.8.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 4c74d8675d0d178cf0ae217315cbfd2c2259808298faea271909f30d154bdc9b

build:
  skip: true  # [py<312]
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python
    - pip
    - setuptools >=61.0
    - setuptools-scm >=6.2
    - toml
  run:
    - python
    - geopandas >=1.1.0
    - libpysal >=4.12.0
    - mapclassify >=2.9.0
    - networkx >=3.4
    - numpy >=2.0.0
    - pandas >=2.3.0
    - pointpats >=2.5.2
    - pulp >=3.2,<4
    - scikit-learn >=1.5.0
    - scipy >=1.14.0
    - shapely >=2.1.0
    - spaghetti >=1.7.4
    - tqdm >=4.67.0
  run_constrained:
    # notebooks
    - matplotlib-base >=3.8
    # sa3
    - fast_hdbscan >=0.2.2

# missing test data file: airbnb_Chicago 2015.shp
# DataSourceError: None: No such file or directory
{% set skip_tests = "" %}
{% set skip_tests = skip_tests + " --deselect=spopt/tests/test_region/test_sa3.py::TestSA3::test_ward_eom_3" %}
{% set skip_tests = skip_tests + " --deselect=spopt/tests/test_region/test_sa3.py::TestSA3::test_ward_leaf_10" %}
{% set skip_tests = skip_tests + " --deselect=spopt/tests/test_region/test_sa3.py::TestSA3::test_extract_clusters" %}
{% set skip_tests = skip_tests + " --deselect=spopt/tests/test_region/test_sa3.py::TestSA3::test_invalid_extraction" %}

test:
  source_files:
    - spopt/tests
  imports:
    - spopt
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - if exist %PREFIX%\Library\bin\cbc.exe (if not exist %PREFIX%\Lib\site-packages\pulp\solverdir\cbc\win\i64 (mkdir %PREFIX%\Lib\site-packages\pulp\solverdir\cbc\win\i64) && copy %PREFIX%\Library\bin\cbc.exe %PREFIX%\Lib\site-packages\pulp\solverdir\cbc\win\i64\cbc.exe)  # [win]
    - pytest -vv {{ skip_tests }} spopt/tests
  requires:
    - pip
    - python
    - pytest
    - coin-or-cbc

about:
  home: https://pysal.org/spopt
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: spopt - Spatial Optimization
  description: |
    Spopt is an open-source Python library for solving optimization problems
    with spatial data. Originating from the `region` module
    in [PySAL](http://pysal.org) (Python Spatial Analysis Library), it is
    under active development for the inclusion of newly proposed models and
    methods for regionalization, facility location, and
    transportation-oriented solutions.
  doc_url: https://pysal.org/spopt
  dev_url: https://github.com/pysal/spopt

extra:
  recipe-maintainers:
    - jGaboardi
    - knaaptime
    - xf37
    - gegen07
    - martinfleis
